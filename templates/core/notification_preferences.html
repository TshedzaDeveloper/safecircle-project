{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Notification Preferences</h3>
                </div>
                <div class="card-body">
                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}
                        
                        <h5 class="mb-3">Emergency Alerts</h5>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="emergency_alerts" id="emergency_alerts" checked>
                            <label class="form-check-label" for="emergency_alerts">
                                Receive emergency alerts in your area
                            </label>
                        </div>
                        
                        <h5 class="mb-3">SafeCircle Updates</h5>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="safecircle_updates" id="safecircle_updates" checked>
                            <label class="form-check-label" for="safecircle_updates">
                                Receive updates from your SafeCircles
                            </label>
                        </div>
                        
                        <h5 class="mb-3">Crime Reports</h5>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="crime_reports" id="crime_reports" checked>
                            <label class="form-check-label" for="crime_reports">
                                Receive notifications about new crime reports in your area
                            </label>
                        </div>
                        
                        <h5 class="mb-3">Notification Methods</h5>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="email_notifications" id="email_notifications" checked>
                            <label class="form-check-label" for="email_notifications">
                                Email notifications
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="sms_notifications" id="sms_notifications">
                            <label class="form-check-label" for="sms_notifications">
                                SMS notifications
                            </label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="push_notifications" id="push_notifications" checked>
                            <label class="form-check-label" for="push_notifications">
                                Push notifications
                            </label>
                        </div>
                        
                        <div class="form-group mt-4">
                            <button type="submit" class="btn btn-primary btn-lg w-100">Save Preferences</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize notification preferences
        const form = document.querySelector('form');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const preferences = {
                emergency_alerts: document.getElementById('emergency_alerts').checked,
                safecircle_updates: document.getElementById('safecircle_updates').checked,
                crime_reports: document.getElementById('crime_reports').checked,
                email_notifications: document.getElementById('email_notifications').checked,
                sms_notifications: document.getElementById('sms_notifications').checked,
                push_notifications: document.getElementById('push_notifications').checked
            };
            
            // Here you would typically send these preferences to the server
            form.submit();
        });
    });
</script>
{% endblock %}
