services:
  - type: web
    name: safecircle
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn safecircle.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: safecircle.settings
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: safecircle.onrender.com
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: safecircle-db
          property: connectionString
    plan: free
    disk:
      name: safecircle-data
      mountPath: /opt/render/project/src
      sizeGB: 1

databases:
  - name: safecircle-db
    databaseName: safecircle
    user: safecircle
    plan: free 